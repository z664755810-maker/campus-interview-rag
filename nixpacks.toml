# Nixpacks 构建配置
#
# 两个核心决策：
# 1. 锁死 Python 3.12，避开 chroma-hnswlib 在 3.13 上没有官方预编译 wheel、
#    只能现场编译（且需要 MSVC）这个大坑。
# 2. 不要在 nixPkgs 里加 python312Packages.pip——Nix 会从源码编译它，
#    进而引入 cffi 作为构建依赖，cffi 测试套件在 Python 3.12 下因
#    'No module named imp'（imp 在 3.12 被移除）崩溃。
#    正确做法：靠 Python 自带的 ensurepip 来装 pip，零额外依赖。

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "cd backend",
  "python -m ensurepip --upgrade",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
